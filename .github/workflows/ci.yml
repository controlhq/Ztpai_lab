name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        # efemeryczna baza istniejąca tylko na czas joba - to nie są dane produkcyjne
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: room_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d room_booking_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/room_booking_test
      JWT_EXPIRES_IN: 15m

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # losowy klucz tylko dla tego uruchomienia - żaden sekret nie jest zapisany w repozytorium
      - name: Generate JWT secret for tests
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t room-booking-api:ci .
